name: Publish mamar-editor

# Publishes mamar-editor to npm when a tag such as mamar-editor-v0.1.0 is pushed.
# The tag must match the version in mamar-editor/package.json. The package
# bundles mamar-audio, which is built from a papermario-dx checkout.

on:
  push:
    tags:
      - "mamar-editor-v*"

env:
  DX_DIR: papermario-dx

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusts this workflow to publish mamar-editor, given the identity
    # token GitHub issues it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bates64/papermario-dx
          path: papermario-dx
      - uses: cachix/install-nix-action@v31

      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version mamar-editor/package.json)
          if [ "${GITHUB_REF_NAME}" != "mamar-editor-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match mamar-editor's version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: nix develop --command yarn install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Publish
        run: |
          cd mamar-editor
          nix develop --command npx --yes npm@11 publish --access public
