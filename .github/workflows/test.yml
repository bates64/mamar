name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Download test data
        run: cd pm64/tests/bin && curl -Lo mamar_test_data.zip $TEST_DATA_URL && unzip mamar_test_data.zip
        env:
          TEST_DATA_URL: https://drive.google.com/uc?export=download&id=1EY_nx_6xtpApgh3qyGivgU0OcpzkKRn0

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose --no-fail-fast
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo check
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: yarn install
      # Builds mamar-wasm-bridge and pm64-typegen, which mamar-web type-checks against.
      - run: yarn workspace mamar-web wasm:build
      - run: yarn run lint
      - run: cargo clippy --all-features
